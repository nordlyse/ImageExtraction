name: image-extraction

services:
  # facebook/sam2.1-hiera-small and transformers are Apache-2.0.
  # PyTorch and torchvision are BSD-3, the runtime SAM 2 uses.
  # Pillow is MIT-CMU.
  sam2:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        RUN pip install --no-cache-dir torch==2.14.1 torchvision==0.29.1 transformers==5.19.0 pillow==12.3.0
        WORKDIR /opt/image-extraction
        COPY sam/split_image.py /opt/image-extraction/split_image.py
        ENV PYTHONUNBUFFERED=1 HF_HOME=/models HF_HUB_DISABLE_TELEMETRY=1
        CMD ["python", "/opt/image-extraction/split_image.py"]
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - images:/images
      - sam2-models:/models
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/sam2-ready"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s

  # Caddy is Apache-2.0. It proxies /api to the SAM service.
  web:
    image: caddy:2.10.2-alpine
    depends_on:
      - sam2
    ports:
      - "8090:80"
    volumes:
      - ./web:/usr/share/caddy:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  images:
  sam2-models:
